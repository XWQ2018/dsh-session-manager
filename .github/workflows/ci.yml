name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: 测试（Node ${{ matrix.node }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # 本项目零运行时依赖，无需安装步骤
      - name: 运行测试
        run: npm test